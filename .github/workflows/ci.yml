name: conformance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run suite (no dependencies)
        run: python run_tests.py
      - name: Generate vectors
        run: python tools/gen_vectors.py
      - name: Vectors must be reproducible
        run: git diff --exit-code -- vectors/
